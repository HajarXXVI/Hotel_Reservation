{% extends "base.html" %}
{% load static %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-3 mt-5">
                <div class="card-body p-4">
                    <h1 class="card-title text-center mb-5">My Profile</h1>
                    
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="email" value="{{ user.email }}" readonly>
                                    <label for="email">Email address</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="tel" name="phone_number" class="form-control" id="phone_number" 
                                           value="{{ user.phone_number }}" placeholder="Phone number">
                                    <label for="phone_number">Phone number</label>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" name="first_name" class="form-control" id="first_name" 
                                           value="{{ user.first_name }}" placeholder="First name">
                                    <label for="first_name">First name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" name="last_name" class="form-control" id="last_name" 
                                           value="{{ user.last_name }}" placeholder="Last name">
                                    <label for="last_name">Last name</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="text" name="address" class="form-control" id="address" 
                                   value="{{ user.address }}" placeholder="Address">
                            <label for="address">Address</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="text" name="city" class="form-control" id="city" 
                                   value="{{ user.city }}" placeholder="City">
                            <label for="city">City</label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <a href="{% url 'account_change_password' %}" class="btn btn-outline-secondary">
                            Change Password
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    background-color: #fff;
    transition: all 0.3s ease-in-out;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
}

.form-floating input:focus,
.form-floating select:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}
</style>
{% endblock %}
