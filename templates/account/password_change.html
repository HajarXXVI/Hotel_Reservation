{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">{% trans "Change Password" %}</h1>
                    <form method="post" action="{% url 'account_change_password' %}">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button class="btn btn-primary w-100 mt-3" type="submit">{% trans "Change Password" %}</button>
                        <a href="{% url 'account_reset_password' %}" class="btn btn-link w-100 mt-2">{% trans "Forgot Password?" %}</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
